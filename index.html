<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daftar Isi - Peta Progres Belajar</title>
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#e3f1ef; --card:#ffffff; --fg:#10272b; --muted:#4f6a6d; --line:#cfe3e0;
  --a:#0e8a7d; --a2:#14b8a6; --head:#0b5f58;
  --t1:#9fdcd2; --t2:#c6ece6; --td1:#7ccfc3; --td2:#a6e1d8;
  --m1:#d6f1ed; --m2:#effaf8; --md1:#b9e6df; --md2:#d8f2ee;
  --font-d:"Bricolage Grotesque","Trebuchet MS",sans-serif; --font-b:"Source Sans 3","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#f3f7f7}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--fg);font-family:var(--font-b);line-height:1.3}

/* Satu halaman penuh: rasio 900 x 1260 (sama dengan gambar latar Hal. 3), skala mengikuti layar */
.page{
  position:relative;flex:none;
  width:min(100vw,calc(100vh * 900 / 1260));
  width:min(100vw,calc(100dvh * 900 / 1260));
  aspect-ratio:900/1260;
  container-type:inline-size;
  background:#f3f7f7;overflow:hidden;
}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}

/* Widget menempati area isi halaman: di bawah header gelombang, di atas footer */
.w{
  position:absolute;left:0;width:100%;top:17.7%;height:80.9%;
  font-size:2.5cqw;
  padding:1.2em calc(7.33cqw - 1.5px) 1.65em;
  background:transparent;border:1.5px solid var(--a);border-top:0;border-radius:0;
  display:flex;flex-direction:column;overflow:hidden;
}
.head{display:flex;flex-direction:column;gap:.1em}
.eye{font-size:.62em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
h1{font-family:var(--font-d);font-size:1.5em;line-height:1.1;margin:0;color:var(--head)}
.sub{margin:.2em 0 0;font-size:.8em;color:var(--muted)}
.meter{display:flex;align-items:center;gap:.6em;margin:.65em 0 .7em}
.bar{flex:1;height:.75em;border-radius:.4em;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .3s}
.cnt{font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.g{
  flex:1;min-height:0;display:grid;gap:.5em;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:minmax(2.9em,1fr);
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
}
.c{--c:var(--a);--x1:var(--m1);--x2:var(--m2);--d1:var(--md1);--d2:var(--md2);display:flex;align-items:center;gap:.55em;min-width:0;padding:.3em .6em;border-radius:.8em;border:1.5px solid var(--c);background:linear-gradient(135deg,var(--x1),var(--x2));color:var(--fg);font:inherit;font-size:.95em;text-align:left;cursor:pointer}
.c.tua{--x1:var(--t1);--x2:var(--t2);--d1:var(--td1);--d2:var(--td2)}
.c.wide{grid-column:1 / -1}
.c:focus-visible{outline:3px solid var(--fg);outline-offset:1px}
.ico{flex:none;width:2.1em;height:2.1em;border-radius:.6em;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center}
.ico svg{width:1.25em;height:1.25em;stroke:var(--card);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.l{flex:1;min-width:0;line-height:1.15;overflow-wrap:break-word}
.k{flex:none;width:1.35em;height:1.35em;border-radius:50%;border:1.8px solid var(--c);background:var(--card);display:grid;place-items:center}
.c[aria-pressed="true"] .k{background:var(--a)}
.c[aria-pressed="true"] .k:after{content:"";width:.6em;height:.3em;border-left:2px solid var(--card);border-bottom:2px solid var(--card);transform:rotate(-45deg) translate(.05em,-.08em)}
.c[aria-pressed="true"]{background:linear-gradient(135deg,var(--d1),var(--d2))}
.c[aria-pressed="true"] .l{opacity:.75}
.foot{display:flex;justify-content:flex-end;gap:.6em;margin-top:.5em;font-size:.75em;color:var(--muted)}
.rs{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
